#@TYPE: Machine
#@NAME: iPool SZ3568
#@DESCRIPTION: Custom Rockchip RK3568 board (SZ3568) for the iPool Pilot pool controller

require conf/machine/include/rk3568.inc

# --- Device tree -----------------------------------------------------------
# Phase 1/M1 (bring-up): boot the generic RK3568 EVB device tree on the real
# board just to reach a serial console + eMMC. The rkbin TPL handles DRAM init,
# so a stock EVB DT usually gets us to a login prompt.
# Our board DT (starts as an EVB derivative that adds the ttyS8 serial console;
# grows into the real board hardware in Phase 2). Built from the DTS shipped by
# our linux-yocto_%.bbappend.
# --- PATH B: vendor BSP kernel for the display -----------------------------
# Mainline linux-yocto 6.16 could not drive this board's native RK3568 LVDS
# panel. Switch virtual/kernel to the Rockchip 6.1 vendor BSP (meta-ipool
# recipes-kernel/linux-rockchip), whose vendor DT + LVDS driver + libmali are
# known to drive this exact panel. boot2qt/Qt 6.11 userspace is unchanged.
# meta-rockchip's rockchip-defaults.inc sets this to linux-yocto with ?=, so a
# hard assignment here wins.
PREFERRED_PROVIDER_virtual/kernel = "linux-rockchip"

# B2: board device tree for the vendor kernel — iPool SZ3568 with the 1024x600
# LVDS panel and the EVB's cameras/NPU/i2c-touch disabled (those hung the boot
# on the plain EVB DT). Shipped by the linux-rockchip recipe.
KERNEL_DEVICETREE = "rockchip/rk3568-sz3568-linux.dtb"

# --- U-Boot ----------------------------------------------------------------
# Start on the generic RK3568 EVB U-Boot defconfig (per Phase 0 decision).
# Confirm the exact mainline defconfig name at first build; customize only if
# the board fails to load the kernel.
UBOOT_MACHINE = "evb-rk3568_defconfig"

# --- Kernel image type -----------------------------------------------------
# whinlatter's oe-core removed the kernel-fitimage class (FIT images are now
# built by the separate linux-yocto-fitimage recipe, and "fitImage" is rejected
# as a KERNEL_IMAGETYPE). meta-rockchip's rk3568.inc still sets the dead class,
# so we override: boot a plain arm64 Image + separate DTB via extlinux, which
# rockchip-extlinux.inc already supports (pulls kernel-devicetree). Revisit
# signed FIT via linux-yocto-fitimage in Phase 6 if secure boot is needed.
KERNEL_CLASSES = ""
KERNEL_IMAGETYPE = "Image"

# --- Qt module trimming ----------------------------------------------------
# The pool controller does not use QtWebEngine (a large Chromium build) or the
# QtWebView wrapper that build-depends on it. meta-qt6 enables webengine on
# aarch64 whenever DISTRO_FEATURES has opengl (which we need for Mali), via
# QTWEBENGINE_SUPPORTED:aarch64. Force it off — :forcevariable beats that arch
# override. This drops qtwebengine + qtwebview from BOTH the packagegroup and
# python3-pyside6's bindings (pyside6 otherwise build-depends on qtwebengine).
# qt3d and qtsensors are not gated by this variable — see the
# packagegroup-qt6-addons.bbappend in this layer for those.
QTWEBENGINE_SUPPORTED:forcevariable = "0"

# --- Drop container/virtualization stack -----------------------------------
# boot2qt's b2qt.conf enables "virtualization" in DISTRO_FEATURES, which makes
# the image pull packagegroup-docker (docker + containerd + nerdctl). A pool
# controller has no use for containers, and nerdctl (a Go recipe) also fails
# do_rm_work on its read-only Go module cache. Remove the feature entirely
# (:remove wins over b2qt.conf's += regardless of parse order).
DISTRO_FEATURES:remove = "virtualization"

# --- Misc ------------------------------------------------------------------
MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"

# --- GPU: proprietary Mali-G52 libmali, SHADOWING Mesa (vendor's approach) ----
# panfrost/Mesa HARD-HANGS this vendor kernel on GPU power-on. The vendor's own
# image drives the GPU with the proprietary Mali Bifrost KO (built into the
# kernel via the defconfig) + the libmali userspace blob, which SHADOWS Mesa via
# ld.so.conf.d (both installed; the mali dir is searched first). We do the same:
# install libmali; mesa keeps building normally (Vulkan/software) but Weston/Qt
# load libmali's libEGL/libGLESv2/libgbm at runtime. No virtual/provider games.
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "libmali"
# The iPool Poolnook app -- installs /usr/bin/appPoolnook + /usr/bin/b2qt symlink,
# so b2qt.service boots straight into it fullscreen on eglfs (GPU via libmali) and
# the multi-process demolauncher auto-disables (ConditionPathExists=!/usr/bin/b2qt).
IMAGE_INSTALL:append = " poolnook"

# --- Drop the Qt demo launcher + its example payload -----------------------
# Since poolnook owns /usr/bin/b2qt the demolauncher never actually runs, but it
# is still BUILT and installed: packagegroup-b2qt-embedded-addons pulls
# boot2qt-demolauncher (USE_QT_DEMO_LAUNCHER defaults to 1 whenever
# DISTRO_FEATURES has wayland), which RDEPENDS qtdoc-examples, which
# DEPENDS qtpdf on aarch64 -- and qtpdf DEPENDS nodejs-native, i.e. a full V8
# build. That V8 build is what OOM-killed cc1plus ("g++: fatal error: Killed
# signal terminated program cc1plus").
#
# Note this branch is NOT covered by QTWEBENGINE_SUPPORTED = "0" above:
# qtdoc-examples gates its qtpdf dependency on `opengl` in DISTRO_FEATURES
# (which we need for Mali), not on QTWEBENGINE_SUPPORTED. Turning the launcher
# off removes demolauncher + qtdoc-examples + qtpdf + nodejs from the build.
USE_QT_DEMO_LAUNCHER = "0"
# WiFi: the board's chip is RTL8723DS (SDIO) -- confirmed by the vendor's own
# working sz3568 image (its DTB says wifi_chip_type="rtl8723ds" and it ships
# 8723ds.ko). We only need to add the DRIVER: the base b2qt image already ships
# ConnMan + qtdeviceutilities, which is exactly what the poolnook app uses
# (QtDeviceUtilities.NetworkSettings -> ConnMan) to scan networks and let the
# user pick one + enter the passphrase at runtime. So NO baked credentials, NO
# manual wpa_supplicant/networkd (that would fight ConnMan for wlan0) -- just the
# 8723ds driver (auto-loads) and let ConnMan + the app manage the connection.
IMAGE_INSTALL:append = " rtl8723ds"
# The kernel has CONFIG_CFG80211_REQUIRE_SIGNED_REGDB=y, so cfg80211 wants a
# signed regulatory.db ("cfg80211: failed to load regulatory.db" without it).
# wireless-regdb provides /lib/firmware/regulatory.db(.p7s) so channels/power
# are set correctly for the 2.4GHz RTL8723DS.
IMAGE_INSTALL:append = " wireless-regdb"
# WiFi is confirmed working (ConnMan + the app associate + DHCP over wlan0). The
# temporary serial wifi-diag is removed. Keep `iw` (handy for on-board WiFi checks
# like `iw dev wlan0 link`) and the SSH server (shell over WiFi).
IMAGE_INSTALL:append = " iw openssh-sshd"
# Wired-ethernet bring-up tools. mdio-tools lets us walk the GMAC1 MDIO bus from
# the target ("mdio stmmac-1" / "mdio stmmac-1 phy 0x1 raw 2") instead of doing a
# rebuild+reflash cycle per guess at the PHY address; ethtool reports link state.
# Both are small -- keep them, wired debugging tends to come back.
IMAGE_INSTALL:append = " mdio-tools ethtool"

# --- OTA: RAUC A/B with rollback ------------------------------------------
# Use meta-rockchip's proven rk-rauc-demo pattern (kernel-in-rootfs A/B, a
# u-boot boot.scr that selects the slot + counts boots + rolls back, and
# systemd-repart that grows rootfsA/rootfsB/data into the 16GB eMMC on first
# boot). meta-rauc's whinlatter branch supports our Yocto natively.
#   - rauc DISTRO_FEATURE     : pulls in the rauc client + enables the demo class
#   - rk-u-boot-env MACHINE_FEATURE : persistent u-boot env in eMMC (boot counters)
#   - RK_RAUC_DEMO=1          : activates the rk-rauc-demo override (boot.scr,
#                               abd-partition/repart, rauc system.conf, ext4 fstype)
DISTRO_FEATURES:append = " rauc"
MACHINE_FEATURES:append = " rk-u-boot-env"
RK_RAUC_DEMO = "1"

# THE fix for "board does not boot after a fresh flash".
#
# Enabling RK_RAUC_DEMO switches the boot path from extlinux to meta-rockchip's
# boot.scr, and that script builds the kernel command line as
#     bootargs = "${bootargsbase} root=${RAUC_BOOTPART} rauc.slot=${RAUC_SLOT}"
# i.e. every one of our kernel args now arrives via the U-Boot *environment*
# variable bootargsbase, NOT via extlinux.conf. meta-rockchip's rauc u-boot
# bbappend does write it (bootargsbase=${UBOOT_EXTLINUX_KERNEL_ARGS}
# ${UBOOT_EXTLINUX_CONSOLE}) -- but only into the text file u-boot-initial-env.
#
# Turning that text file into the binary u-boot.env AND rawcopying it into the
# wic's uboot_env partition (sector 8128) is gated on RK_IMAGE_INCLUDES_UBOOT_ENV,
# which rockchip-wic.inc defaults to "no". So a freshly flashed board came up with
# an EMPTY environment: bootargsbase unset -> no console=, no rootwait, and
# critically no pm_domains.always_on=1, which is what stops the vendor kernel
# crashing in rockchip_pmu_save_qos. Hence the board only booted after manually
# doing `setenv bootargsbase ...` on the U-Boot console (boot.scr does `env save`,
# which is why that survived until the next reflash wiped the env partition).
#
# Setting this to 1 bakes the correct bootargsbase into the image, so no serial
# console is needed. Verify after a build with:
#   strings <image>.wic | grep bootargsbase
RK_IMAGE_INCLUDES_UBOOT_ENV = "1"
IMAGE_INSTALL:append = " rauc"
# hawkBit DDI client: polls a hawkBit server, downloads assigned .raucb bundles
# and drives `rauc install` over the RAUC D-Bus API. Config in meta-ipool's
# rauc-hawkbit-updater bbappend points it at the local test server (10.0.0.82:8080).
IMAGE_INSTALL:append = " rauc-hawkbit-updater"
# Activate staged updates at 03:00 rather than the instant they install.
# rauc-hawkbit-updater keeps post_update_reboot = false so an OTA never reboots
# mid-cycle: the relay board is hardware-latched, so a surprise reboot would leave
# pumps/heaters running unsupervised for the ~40s the board takes to come back.
# rauc-activate.timer reboots at a quiet hour instead, only when a slot is
# actually staged and marked good.
IMAGE_INSTALL:append = " rauc-activate"

# Serial console on the board's UART3 header (SoC uart8 -> ttyS8), which is
# 3.3V TTL and broken out to a labeled 1x4 connector — unlike the RK3568 debug
# uart2/ttyS2, which this board does not expose. 115200 8N1 for a plain USB-TTL
# adapter. This sets the kernel console + a serial-getty on ttyS8; the DTS
# (rk3568-sz3568.dts) enables uart8 and points stdout-path at it.
# NOTE: U-Boot's own console is still uart2 (from its EVB defconfig), so the
# earliest U-Boot/SPL output won't appear on ttyS8 — only kernel onward.
SERIAL_CONSOLES = "115200;ttyS8"

# --- HDMI: force a mode (EDID read on this board returns nothing) -----------
# The HDMI connector reports "connected" but EDID make/model come back
# "unknown" with zero modes, so nothing can set a display mode ("no available
# modes for HDMI-A-1"). Force a standard mode on the cmdline so the kernel
# console + Weston can drive HDMI without EDID. Drop to 1280x720@60 if a given
# monitor won't sync at 1080p.
# PATH B: the vendor kernel on the EVB DT powers off unused domains (NPU/cameras
# the board lacks), then an IOMMU IRQ touches the now-unpowered block ->
# synchronous external abort -> boot hang. pd_ignore_unused keeps unused power
# domains on, avoiding it. (clk_ignore_unused likewise guards stray clock gating.)
# Revisit once on the board's vendor DT (which drops those nodes).
UBOOT_EXTLINUX_KERNEL_ARGS:append = " pd_ignore_unused clk_ignore_unused"

# THE fix for the boot crash on the vendor DTS: the vendor kernel powers OFF an
# idle power domain at runtime (genpd_power_off_work_fn) and rockchip_pmu_save_qos
# does an MMIO read on that domain's QoS/NIU block whose clock is gated ->
# "synchronous external abort ... regmap_mmio_read32le" -> boot crash before
# userspace. It is systemic (any domain that goes idle hits it), so disabling
# individual devices only moves the crash. The rockchip pm_domains driver has a
# built-in escape hatch: module param pm_domains.always_on makes rockchip_pd_power()
# return early on power-OFF, so no domain is ever powered off and save_qos never
# runs. Costs a little idle power; revert once root-caused or on the real vendor
# kernel. (pd_ignore_unused above only covers the boot-time unused sweep, not this
# runtime power-off, which is why it wasn't enough.)
UBOOT_EXTLINUX_KERNEL_ARGS:append = " pm_domains.always_on=1"

# DISPLAY BRING-UP (temporary): boot to multi-user (console), NOT graphical, so
# Boot2Qt's Weston/demo don't try to drive the GPU-less DRM and reset-loop (as
# happened on the HDMI attempt). fbcon still lights the LVDS panel with the
# kernel console, which is what proves the VOP2->DSI0->GM8775C->panel pipe.
# Remove this once libmali/Weston are in and we want the Qt UI.
UBOOT_EXTLINUX_KERNEL_ARGS:append = " systemd.unit=multi-user.target"

