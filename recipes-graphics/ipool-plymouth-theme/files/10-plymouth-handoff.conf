# Boot-splash -> Qt app hand-off.
# Plymouth (DRM renderer) owns the LVDS during boot. Right before the Boot2Qt
# app grabs KMS/DRM, quit plymouth but --retain-splash so the last logo frame
# stays in the scanout buffer until the app draws its first frame (no black
# flash). The default plymouth-quit.service is overridden elsewhere to also use
# --retain-splash so it can't blank the screen early.
[Unit]
After=plymouth-start.service

[Service]
ExecStartPre=-/bin/sh -c '/usr/bin/plymouth --ping && /usr/bin/plymouth quit --retain-splash || true'
