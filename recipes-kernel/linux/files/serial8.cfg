# The board's console is uart8 (serial8 alias -> ttyS8). The default 8250 limits
# (NR_UARTS=8 -> max ttyS7, RUNTIME_UARTS=4) are too low, so uart8 can't take
# line 8 and gets a dynamic ttyS0, breaking console=ttyS8 and the serial-getty.
# Raise the limits to cover serial0..serial9 so uart8 is deterministically ttyS8.
CONFIG_SERIAL_8250_NR_UARTS=10
CONFIG_SERIAL_8250_RUNTIME_UARTS=10
