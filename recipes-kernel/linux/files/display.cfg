# Display chain for the SZ3568 panel: VOP2 -> DSI0 -> TC358775 -> LVDS panel.
# The TC358775 DSI-to-LVDS bridge driver is NOT enabled in the base config (the
# EVB doesn't use it), which blocked the whole component-based rockchip-drm from
# binding. Enable it, and build the panel-lvds + DW-MIPI-DSI core in (not
# modules) so the display component aggregate has everything at probe time.
CONFIG_DRM_TOSHIBA_TC358775=y
CONFIG_DRM_PANEL_LVDS=y
CONFIG_DRM_DW_MIPI_DSI=y
