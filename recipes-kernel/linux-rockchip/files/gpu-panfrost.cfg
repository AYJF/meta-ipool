# iPool SZ3568 GPU: use the OPEN panfrost stack to match the image's Mesa
# userspace (libgles2-mesa / mesa-megadriver, panfrost gallium driver). The
# RK3568 GPU is a Mali-G52 (Bifrost); mainline panfrost drives it and binds to
# the "arm,mali-bifrost" gpu node. The vendor defconfig instead enabled the
# PROPRIETARY Mali kernel blob (CONFIG_MALI_BIFROST) whose ABI needs libmali
# userspace (which we do NOT ship) -- that mismatch left Qt/Weston with no GLES.
# Turn panfrost ON and the proprietary Mali drivers OFF so panfrost owns the GPU.
CONFIG_DRM_PANFROST=y
# CONFIG_MALI_BIFROST is not set
# CONFIG_MALI_MIDGARD is not set
# CONFIG_MALI400 is not set
# CONFIG_MALI450 is not set
