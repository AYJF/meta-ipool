# RAUC ships "verity" format bundles (rk-rauc-demo default): a squashfs image
# with an appended dm-verity hash tree, mounted on the target via device-mapper.
# The rockchip vendor defconfig leaves CONFIG_BLK_DEV_DM off, so /dev/mapper/control
# does not exist and `rauc install` fails at the mount step:
#   "Failed mounting bundle: Failed to open /dev/mapper/control: No such file or directory"
# Enable device-mapper core + the dm-verity target (loop + squashfs are already on).
CONFIG_MD=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_VERITY=y
