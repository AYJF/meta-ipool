# Maxio MAE0621A Gigabit PHY on gmac1 (iPool SZ3568).
#
# Built IN (=y), deliberately not =m: phylib binds a PHY to whatever driver
# matches at MDIO-scan time and falls back to genphy otherwise. stmmac probes
# during boot, so a module loaded later would never take over the already-bound
# phydev -- the MAE0621A clock-mode init would then never run.
CONFIG_MAXIO_PHY=y

# Insurance: schematic sheet 23 marks U12's footprint "RTL8211F-CG/YT8531H/C", so
# the fitted PHY varies by board build. MOTORCOMM (YT8531) is already =y in the
# vendor defconfig; REALTEK (RTL8211F, id 0x001cc942) was NOT. With the MDIO bus
# scanned rather than a fixed address, whichever part is present can now bind its
# real driver instead of falling back to genphy.
CONFIG_REALTEK_PHY=y

# The vendor defconfig already has these, but gmac1 is useless without them and
# an =y PHY driver needs phylib present, so pin them explicitly.
CONFIG_PHYLIB=y
CONFIG_STMMAC_ETH=y
CONFIG_STMMAC_PLATFORM=y
CONFIG_DWMAC_ROCKCHIP=y
