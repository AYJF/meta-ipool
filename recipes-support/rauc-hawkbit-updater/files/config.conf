# rauc-hawkbit-updater config for the iPool SZ3568 — LOCAL hawkBit test,
# AUTO-REGISTRATION mode. Uses one shared gateway_token; each board self-
# registers on first poll under a unique controller id (target_name), which
# hawkbit-set-target-id derives from the board serial at service start
# (see the systemd drop-in). target_name below is a placeholder.
#
# NOTE: 10.0.0.82 is the dev PC's LAN IP; the board reaches it over Wi-Fi
# (Ethernet is disabled on this board). Change if the PC's IP changes.
[client]
hawkbit_server            = 10.0.0.82:8080
ssl                       = false
ssl_verify                = false
tenant_id                 = DEFAULT
target_name               = sz3568-unset
gateway_token             = ipoolGatewayToken2026
bundle_download_location  = /tmp/bundle.raucb
retry_wait                = 30
connect_timeout           = 20
timeout                   = 60
log_level                 = message
post_update_reboot        = false

[device]
product                   = iPool-SZ3568
model                     = SZ3568
hw_revision               = 1
