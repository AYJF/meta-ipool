# rauc-hawkbit-updater config for the iPool SZ3568 -- CLOUD hawkBit,
# AUTO-REGISTRATION mode.
#
# Each board self-registers on first poll under a unique controller id
# (target_name), derived from the board serial by hawkbit-set-target-id at
# service start (see the systemd drop-in 10-target-id.conf). Both target_name
# and gateway_token below are PLACEHOLDERS -- see notes on each.
#
# Server: Hetzner CX23, hel1. TLS terminates at Caddy with a Let's Encrypt cert;
# the image ships ca-certificates, so ssl_verify = true validates properly.
# Never set ssl_verify = false here: the gateway token travels in the
# Authorization header, and without verification it can be handed to an
# impostor via DNS spoofing or a hostile network.
[client]
hawkbit_server            = updates.nexpoolsystem.com
ssl                       = true
ssl_verify                = true
tenant_id                 = DEFAULT
target_name               = sz3568-unset
# PLACEHOLDER. Substituted at do_install from a file OUTSIDE this git repo --
# meta-ipool is pushed to github.com/AYJF/meta-ipool, and a gateway token grants
# any holder the right to register and pull bundles. See the bbappend.
gateway_token             = @GATEWAY_TOKEN@
bundle_download_location  = /tmp/bundle.raucb
retry_wait                = 30
connect_timeout           = 20
timeout                   = 60
log_level                 = message
post_update_reboot        = false

[device]
product                   = iPool-SZ3568
model                     = SZ3568
hw_revision               = 1
