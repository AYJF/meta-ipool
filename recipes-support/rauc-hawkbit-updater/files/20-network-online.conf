[Unit]
# Cold-boot ordering fix.
#
# Observed on a freshly flashed board: the updater started before WiFi/DNS were
# up AND before NTP had corrected the clock (the RTC came up at the image's
# SOURCE_DATE_EPOCH, "Aug 05 2025"), so the first poll died with
#     Scheduled check for new software failed: Could not resolve hostname (6)
# and the next successful poll was >20 minutes later -- retry_wait=30 does not
# behave as intended when the clock jumps forward mid-wait.
#
# Waiting for time-sync matters as much as the network: with a wrong clock, TLS
# verification of the Let's Encrypt certificate can fail outright (the cert is
# not yet valid at the bogus date), which is a far more confusing failure than a
# DNS error. ConnMan manages wlan0 here, so network-online.target is satisfied by
# connman-wait-online.
After=network-online.target time-sync.target
Wants=network-online.target time-sync.target

[Service]
# Do not give up permanently if the network is slow to come up after a power cut.
Restart=always
RestartSec=15
